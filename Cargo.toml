[package]
name = "dagger"
version = "0.1.0"
edition = "2021"
description = "Deterministic reachability and blast-radius analysis for dependency vulnerabilities."

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
petgraph = "0.6"
tree-sitter = "0.20"
tree-sitter-rust = "0.20"
cargo_metadata = "0.18"
ratatui = "0.26"
crossterm = "0.27"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "1"
comfy-table = "7"
walkdir = "2"
semver = "1"
toml_edit = "0.22"
dotenvy = "0.15"

[profile.release]
lto = true
